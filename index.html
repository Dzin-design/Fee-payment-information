<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard ค่าธรรมเนียม</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header><div><h1>Dashboard ข้อมูลค่าธรรมเนียม</h1><p>ข้อมูลการชำระค่าธรรมเนียมจาก Excel</p></div></header>
<main>
<div class="filters">
<label>ปีงบประมาณ<select id="year"><option value="">ทั้งหมด</option></select></label>
<label>เดือน<select id="month"><option value="">ทั้งหมด</option></select></label>
<label>กฎหมาย<select id="law"><option value="">ทั้งหมด</option></select></label>
<button id="reset">รีเซ็ตตัวกรอง</button>
</div>
<div class="cards">
<div><span>ผู้ชำระทั้งหมด</span><strong id="people">0</strong><small>ราย</small></div>
<div><span>เงินรวมทั้งหมด</span><strong id="money">0</strong><small>บาท</small></div>
<div><span>จำนวนเดือน</span><strong id="months">0</strong><small>เดือน</small></div>
<div><span>จำนวนกฎหมาย</span><strong id="laws">0</strong><small>กฎหมาย</small></div>
</div>
<div class="grid">
<section><h2>จำนวนผู้ชำระตามช่องทาง</h2><div class="chart"><canvas id="bar"></canvas></div></section>
<section><h2>สัดส่วนผู้ชำระแต่ละช่องทาง</h2><div class="chart"><canvas id="pie"></canvas></div></section>
<section class="wide"><h2>แนวโน้มจำนวนผู้ชำระรายเดือน</h2><div class="chart"><canvas id="line"></canvas></div></section>
<section><h2>เปรียบเทียบตามกฎหมาย</h2><div class="chart"><canvas id="lawChart"></canvas></div></section>
<section><h2>จำนวนเงินตามช่องทาง</h2><div class="chart"><canvas id="moneyChart"></canvas></div></section>
</div>
<section><h2>ข้อมูลรายละเอียด</h2><div class="tableWrap"><table id="table"></table></div></section>
</main>
<script src="script.js"></script>
</body></html>
